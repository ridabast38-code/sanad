<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Sanad</title>
    <style>
        html, body { margin: 0; height: 100%; background: #f6f4ed; color: #5f605a;
            font-family: Georgia, 'Times New Roman', serif; }
        .wrap { height: 100%; display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 14px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #3f4038;
            animation: pulse 1.2s ease-in-out infinite; }
        @keyframes pulse { 0%,100% { opacity: .3; transform: scale(.8);} 50% { opacity: 1; transform: scale(1);} }
        p { font-size: 15px; letter-spacing: .02em; }
    </style>
</head>
<body>
    <!-- Fallback shown only if the live site can't be reached; normally the app
         loads https://oursanad.com immediately. -->
    <div class="wrap">
        <div class="dot"></div>
        <p>Loading Sanad…</p>
    </div>
</body>
</html>
